  <body>
    <!-- Bouton burger (mobile) -->

    <!-- Overlay sombre (mobile) -->

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="logo-text">🌿 AgriCoop COMAKI</span>
      </div>

      <nav class="sidebar-nav" id="main-nav">
        <ul class="nav-list">
          <li>
            <a href="../dashboard/dashboard.html" class="nav-link">
              <i class="fas fa-home"></i> Tableau de bord
            </a>
          </li>
          <li>
            <a href="../membres/membres.html" class="nav-link active">
              <i class="fas fa-users"></i> Membres

          </li>
          <li>
            <a href="../livraisons/livraisons.html" class="nav-link">
              <i class="fas fa-truck"></i> Livraisons
            </a>

          <li>
            <a href="../paiements/paiements.html" class="nav-link">
              <i class="fas fa-credit-card"></i> Paiements

            <a href="../ventes/ventes.html" class="nav-link">

              <i class="fas fa-user-cog"></i> Comptes
            </a>
          </li>

            <a href="../login/login.html" class="nav-link">
              <i class="fas fa-sign-in-alt"></i> Connexion

          </li>
        </ul>
      </nav>
    </aside>

    <main>
      <h1>Membres</h1>
      <p class="subtitle">Gestion des membres de la coopérative</p>

      <!-- =====================================================================
         FILTRES — TODO (Dev FS2)
         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
      <section class="filtres" aria-label="Filtres de recherche des membres">
        <div class="search-wrapper">
          <i class="ri-search-line" aria-hidden="true"></i>
          <input
            type="text"
            id="champ-recherche-membre"
            placeholder="Rechercher un membre..."
            autocomplete="off"
          />
        </div>
        <select id="filtre-statut" aria-label="Filtrer par statut">
          <option value="">Tous</option>
          <option value="À jour">À jour</option>
          <option value="En retard">En retard</option>
        </select>
      </section>

      <!-- =====================================================================
         NOUVEAU MEMBRE — TODO (Dev FS2)
         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
      <section class="layout-membres">
        <form
          id="form-nouveau-membre"
          aria-labelledby="titre-formulaire-membre"
        >
          <h2 id="titre-formulaire-membre">Ajouter un nouveau membre</h2>

          <label class="sr-only" for="nm-prenom">Prénom</label>
          <input type="text" id="nm-prenom" placeholder="Prénom" required />

          <label class="sr-only" for="nm-nom">Nom</label>
          <input type="text" id="nm-nom" placeholder="Nom" required />

          <label class="sr-only" for="nm-village">Village</label>
          <select id="nm-village" required>
            <option value="">-- Choisir un village --</option>
          </select>

          <label class="sr-only" for="nm-contact">Contact</label>
          <input
            type="text"
            id="nm-contact"
            placeholder="Contact (téléphone)"
            required
          />

          <div class="form-messages">
            <div id="erreurs-nouveau-membre" role="alert" hidden></div>
            <div
              id="message-succes-nouveau-membre"
              role="status"
              aria-live="polite"
              hidden
            ></div>
          </div>

          <button type="submit" class="btn-primary">
            <i class="ri-add-line" aria-hidden="true"></i> Créer le membre
          </button>
        </form>

        <!-- =====================================================================
           LISTE DES MEMBRES — TODO (Dev FS2)
           *** NE PAS MODIFIER l'id ci-dessous — main.js l'utilise ***
           ===================================================================== -->
        <section class="table-section" aria-labelledby="titre-liste-membres">
          <h2 id="titre-liste-membres">Liste des membres</h2>

          <div class="table-header">
            <span>Nom</span>
            <span>Village</span>
            <span>Contact</span>
            <span>Statut</span>
            <span>Solde</span>
          </div>

          <div
            id="liste-membres"
            role="table"
            aria-label="Liste des membres"
          ></div>

          <div class="pagination">
            <button class="page-btn" type="button">Précédent</button>
            <span class="page-info">Page 1</span>
            <button class="page-btn" type="button">Suivant</button>
          </div>
        </section>
      </section>
    </main>

    <!-- NE PAS MODIFIER — scripts de connexion au backend -->
    <script src="../functions.js"></script>
    <script src="../main.js"></script>
    <script>
      const burger = document.getElementById("burger-btn");
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebar-overlay");

      function toggleSidebar() {
        const open = sidebar.classList.toggle("open");
        burger.setAttribute("aria-expanded", open);
        if (overlay) overlay.classList.toggle("visible", open);
      }

      if (burger && sidebar) {
        burger.addEventListener("click", toggleSidebar);
      }
      if (overlay) {
        overlay.addEventListener("click", toggleSidebar);
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AgriCoop Connect — Gestion des membres de
    la coopérative agricole"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.min.css"
    />
    <title>AgriCoop Connect — Membres</title>
    <link rel="stylesheet" href="membres.css" />
  </head>

  <body>
    <!-- NAVIGATION — TODO (Dev FS2) -->
    <header>
      <section class="header__content">
        <div class="title">
          <h1>Membres</h1>
          <span class="subtitle">Gestion des membres de la coopérative</span>
        </div>

        <div class="header__user__info">
          <div class="header__icon__user">
            <i class="ri-user-fill"></i>
          </div>
          <div class="header__content__user">
            <span class="header__name__user">Sandra Malonga</span>
            <span class="header__role__user">Administrateur</span>
          </div>
        </div>
      </section>
    </header>

    <aside class="sidebar">
      <div class="logo">
        <h1>AgriCoop Connect</h1>
      </div>

      <nav>
        <ul class="menu__list">
          <input type="checkbox" id="menu-toggle" class="menu__toggle" />
          <label for="menu-toggle" class="menu__toggle">
            <span></span>
            <span></span>
            <span></span>
          </label>

          <li>
            <a href="../dashboard/dashboard.html">
              <i class="ri-home-9-line"></i>
              Dashboard
            </a>
          </li>

          <li>
            <a href="../membres/membres.html">
              <i class="ri-group-fill"></i>
              Membres
            </a>
          </li>

          <li>
            <a href="../livraisons/livraisons.html">
              <i class="ri-shopping-cart-2-line"></i>
              Livraisons
            </a>
          </li>

          <li>
            <a href="../paiements/paiements.html">
              <i class="ri-wallet-3-fill"></i>
              Paiements
            </a>
          </li>

          <li>
            <a href="../ventes/ventes.html">
              <i class="ri-refund-2-line"></i>
              Ventes
            </a>
          </li>

          <li>
            <a href="../statistiques/statistiques.html">
              <i class="ri-line-chart-line"></i>
              Statistiques
            </a>
          </li>
        </ul>

        <div class="user__info">
          <div class="icon__user">
            <i class="ri-user-fill"></i>
          </div>
          <div class="content__user">
            <span class="name__user">Sandra Malonga</span>
            <span class="role__user">Administrateur</span>
          </div>
        </div>
      </nav>
    </aside>

    <main class="content">
      <!-- =====================================================================
         FILTRES — TODO (Dev FS2)
         Construire une zone de filtrage : un sélecteur de statut et un champ
         de recherche par nom. Layout responsive.

         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
      <section class="filtres">
        <input
          type="text"
          id="champ-recherche-membre"
          placeholder=" Rechercher un membre..."
        />
        <i class="ri-search-line"></i>

        <select id="filtre-statut">
          <option value="">Tous</option>
          <option value="À jour">À jour</option>
          <option value="En retard">En retard</option>
        </select>
      </section>

      <section class="content__nouveau__membre">
        <!-- =====================================================================
         NOUVEAU MEMBRE — TODO (Dev FS2)
         Construire le formulaire de création d'un membre (module Membres,
         nouveau — section 4.1 du FRD). Les 4 champs sont obligatoires.
         Le village est un menu déroulant fermé (rempli par main.js depuis
         la liste de référence de la coopérative), pas un champ libre.

         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
        ===================================================================== -->

        <form id="form-nouveau-membre">
          <h2>Ajouter un nouveau membre</h2>
          <input type="text" id="nm-prenom" placeholder="Prénom" />
          <input type="text" id="nm-nom" placeholder="Nom" />
          <select id="nm-village">
            <option value="">-- Choisir un village --</option>
          </select>
          <input
            type="text"
            id="nm-contact"
            placeholder="Contact (téléphone)"
          />
          <button type="submit" class="btn-primary">
            <i class="ri-add-line"></i>Créer le membre
          </button>
        </form>

        <div id="erreurs-nouveau-membre" hidden></div>
        <div id="message-succes-nouveau-membre" hidden></div>

        <!-- =====================================================================
         LISTE DES MEMBRES — TODO (Dev FS2)
         Le contenu est injecté par main.js. Le dev doit structurer le
         conteneur et styliser les éléments .membre-ligne, .badge.

         *** NE PAS MODIFIER l'id ci-dessous — main.js l'utilise ***
         ===================================================================== -->
        <section class="table-section">
          <h2>Liste des membres</h2>
          <div class="table-header" aria-hidden="true">
            <span>Nom</span>
            <span>Village</span>
            <span>Contact</span>
            <span>Statut</span>
            <span>Solde</span>
          </div>
          <div id="liste-membres"></div>
          <div class="pagination">
            <button class="page-btn" type="button">Précédent</button>
            <span class="page-info">Page 1</span>
            <button class="page-btn" type="button">Suivant</button>
          </div>
        </section>
      </section>
    </main>

    <!-- NE PAS MODIFIER — scripts de connexion au backend -->
    <script src="../functions.js"></script>
    <script src="../main.js"></script>
  </body>
</html>

    <main>
      <h1>Ventes</h1>
      <p class="subtitle">
        Enregistrer et visualiser l’état des ventes et des stocks
      </p>

      <!-- =====================================================================
         CARTES STOCK — TODO (Dev FS5)
         Le contenu est injecté par main.js (une carte par culture avec
         badge et barre de remplissage). Le dev stylise .card, .badge,
         .barre-stock-fond, .barre-stock-remplissage.

         *** NE PAS MODIFIER l'id ci-dessous — main.js l'utilise ***
         ===================================================================== -->
      <section class="section-stocks">
        <h2>État des stocks</h2>
        <div id="cartes-stock"></div>
      </section>

      <!-- =====================================================================
         FORMULAIRE NOUVELLE VENTE
         ===================================================================== -->
      <section class="section-form">
        <h2>Enregistrer une vente</h2>
        <form id="form-vente">
          <div class="form-group">
            <label for="client">Acheteur</label>
            <input
              type="text"
              id="client"
              placeholder="Ex : Christine"
              required
            />
          </div>

          <div class="form-group">
            <label for="culture">Culture</label>
            <select id="culture" required>
              <option value="">-- Choisir une culture --</option>
              <option value="Arachide">Arachide</option>
              <option value="Manioc">Manioc</option>
              <option value="Maïs">Maïs</option>
            </select>
          </div>

          <div class="form-group">
            <label for="quantité">Quantité (kg)</label>
            <input
              type="number"
              id="quantité"
              placeholder="Ex : 450"
              min="1"
              required
            />
          </div>

          <div class="form-group">
            <label for="prix_negocier">Prix négocié (FCFA/kg)</label>
            <input
              type="number"
              id="prix_negocier"
              placeholder="Ex : 350"
              min="1"
              required
            />
          </div>

          <button type="submit">Enregistrer la vente</button>
        </form>
      </section>

      <!-- =====================================================================
         TABLEAU DES VENTES — TODO (Dev FS5)

         *** NE PAS MODIFIER l'id ci-dessous — main.js l'utilise ***
         ===================================================================== -->
      <section class="section-table">
        <h2>Historique des ventes</h2>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Acheteur</th>
                <th>Culture</th>
                <th>Quantité</th>
                <th>Prix/kg</th>
              </tr>
            </thead>
            <tbody id="liste-ventes"></tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- NE PAS MODIFIER — scripts de connexion au backend -->
    <script src="../functions.js"></script>
    <script src="../main.js"></script>
    <script>
      const burger = document.getElementById("burger-btn");
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebar-overlay");

      function toggleSidebar() {
        const open = sidebar.classList.toggle("open");
        burger.setAttribute("aria-expanded", open);
        if (overlay) overlay.classList.toggle("visible", open);
      }

      if (burger && sidebar) {
        burger.addEventListener("click", toggleSidebar);
      }
      if (overlay) {
        overlay.addEventListener("click", toggleSidebar);
      }
    </script>
  </body>

<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriCoop Connect — Ventes & Stock</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="ventes.css">
</head>

<body>

  <main>


    <aside class="sidebar">
      <div class="caption">
        <h1><i>🌿</i><span> AgriCoop Connect</span></h1>
      </div>

      <input id="sidebar-toggler" type="checkbox">
      <label for="sidebar-toggler">
        <i class="fa-solid fa-bars"></i>
      </label>


      <ul id="menu" class="menu">
        <li class="menu-item">
          <a href="#" class="menu-link">
            <i class=""></i>
            <span>Dashboard</span>
          </a>
        </li>

        <li class="menu-item">
          <a href="../comptes/comptes.html" class="menu-link">
            <i class=""></i>
            <span>Comptes</span>
          </a>
        </li>

        <li class="menu-item">
          <a href="../livraisons/livraisons.html" class="menu-link">
            <i class=""></i>
            <span>Livraisons</span>
          </a>
        </li>
        <li class="menu-item">
          <a href="../membres/membres.html" class="menu-link">
            <i class=""></i>
            <span>Membres</span>
          </a>
        </li>
        <li class="menu-item">
          <a href="../paiements/paiements.html" class="menu-link">
            <i class=""></i>
            <span>Paiements</span>
          </a>
        </li>
        <li class="menu-item">
          <a href="../ventes/ventes.html" class="menu-link">
            <i class=""></i>
            <span>Ventes</span>
          </a>
        </li>
        <li class="menu-item">
          <a href="../statistiques/statistiques.html" class="menu-link">
            <i class=""></i>
            <span>Statistiques</span>
          </a>
        </li>
      </ul>

      <form action="">
        <button id="submit" type="submit">
          Deconnexion
        </button>
      </form>
    </aside>

    <div class="main-container">
      <section class="header">
        <div class="section-container">
          <h1>Ventes</h1>
          <p>enregistrer et visualiser l'etat des ventes et des stocks.</p>
        </div>
      </section>

      <section class="stocks">
        <!-- =====================================================================
         CARTES STOCK — TODO (Dev FS5)
         Le contenu est injecté par main.js (une carte par culture avec
         badge et barre de remplissage). Le dev stylise .card, .badge,
         .barre-stock-fond, .barre-stock-remplissage.

         *** NE PAS MODIFIER l'id ci-dessous — main.js l'utilise ***
         ===================================================================== -->
        <div class="section-container">
          <h2 class="stock-label">Etat des stocks</h2>
          <div id="cartes-stock"></div>
        </div>

      </section>

      <section class="sales">
        <div class="section-container">
          <h2 class="sales-label">Historiques de ventes</h2>
          <!-- =====================================================================
         TABLEAU DES VENTES — TODO (Dev FS5)

         *** NE PAS MODIFIER l'id ci-dessous — main.js l'utilise ***
         ===================================================================== -->
          <div class="table-wrapper">
            <table>
              <!-- TODO (Dev FS5) : en-têtes (Acheteur, Culture, Quantité, Prix/kg) -->
              <thead>
                <tr>
                  <th>Acheteur</th>
                  <th>Culture</th>
                  <th>Quantité</th>
                  <th>Prix/kg</th>
                </tr>
              </thead>
              <tbody id="liste-ventes"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="new-sale">
        <div class="section-container">
          <h2>Enregistrer une vente</h2>
          <form action="#">
            <div class="form-field-container">
              <label for="client">Acheteur</label>
              <input placeholder="Ex: Christine" id="client" type="text" required>
            </div>

            <div class="form-field-container">
              <label for="culture">culture</label>
              <select class="crops-selector" name="culture" id="culture" required>
                <option value="Arachide">Arachide</option>
                <option value="Manioc">Manioc</option>
                <option value="Maïs">Maïs</option>
              </select>
            </div>

            <div class="form-field-container">
              <label for="quantité">Quantité (kg)</label>
              <input placeholder="Ex: 450" id="quantité" type="number" required>
            </div>

            <div class="form-field-container">
              <label for="prix_negocier">Prix négocier (FCFA/kg)</label>
              <input placeholder="Ex: 350" id="prix_negocier" type="number" required>
            </div>

            <div class="form-field-container">
              <button type="submit">Enregistrer la vente</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <!-- NE PAS MODIFIER — scripts de connexion au backend -->
  <script src="../functions.js"></script>
  <script src="../main.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriCoop Connect — Livraisons</title>
  <link rel="stylesheet" href="livraisons.css">
</head>
<body>

  <div class="layout">
    <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle-input">

    <aside class="sidebar">
      <div class="sidebar-brand">🌿 AgriCoop COMAKI</div>
      <nav class="sidebar-nav">
        <a href="../dashboard/dashboard.html">Dashboard</a>
        <a href="../membres/membres.html">Membres</a>
        <a href="../livraisons/livraisons.html" class="active">Livraisons</a>
        <a href="../paiements/paiements.html">Paiements</a>
        <a href="../ventes/ventes.html">Ventes</a>
        <a href="../statistiques/statistiques.html">Statistiques</a>
        <a href="../comptes/comptes.html">Comptes</a>
      </nav>
    </aside>

    <div class="content-area">
      <header class="topbar">
        <label for="sidebar-toggle" class="sidebar-toggle-label">☰</label>
        <div>
          <h1>Livraisons</h1>
          <p class="sous-titre">Enregistrer une nouvelle livraison de récolte</p>
        </div>
      </header>

      <main>
        <!-- *** NE PAS MODIFIER les id ci-dessous – main.js les utilise *** -->
        <form id="form-livraison">
          <select id="f-membre">
            <option value="">-- Choisir un membre --</option>
          </select>

          <select id="f-culture">
            <option value="">-- Choisir une culture --</option>
            <option value="Manioc">Manioc</option>
            <option value="Maïs">Maïs</option>
            <option value="Arachide">Arachide</option>
          </select>

          <input type="number" id="f-quantite" min="1" placeholder="Quantité (kg)">

          <button type="submit">Enregistrer</button>
        </form>

        <div id="message-erreur-livraison" class="message message-erreur" hidden></div>
        <div id="message-succes-livraison" class="message message-succes" hidden></div>
        <!-- *** fin de la zone protégée *** -->

        <button id="btn-trier-livraisons">Trier par date</button>

        <table>
          <thead>
            <tr>
              <th>Membre</th>
              <th>Culture</th>
              <th>Quantité</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="liste-livraisons"></tbody>
        </table>
      </main>
    </div>
  </div>

  <!-- NE PAS MODIFIER – scripts de connexion au backend -->
  <script src="../functions.js"></script>
  <script src="../main.js"></script>
</body>
</html>

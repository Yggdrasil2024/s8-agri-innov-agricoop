<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="livraisons.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <!-- Bouton burger (mobile) -->
    <button
      class="burger"
      id="burger-btn"
      aria-label="Menu"
      aria-expanded="false"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Overlay sombre (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="logo-text">🌿 AgriCoop COMAKI</span>
      </div>

      <nav class="sidebar-nav" id="main-nav">
        <ul class="nav-list">
          <li>
            <a href="../dashboard/dashboard.html" class="nav-link">
              <i class="fas fa-home"></i> Tableau de bord
            </a>
          </li>
          <li>
            <a href="../membres/membres.html" class="nav-link">
              <i class="fas fa-users"></i> Membres
            </a>
          </li>
          <li>
            <a href="../livraisons/livraisons.html" class="nav-link active">
              <i class="fas fa-truck"></i> Livraisons
            </a>
          </li>
          <li>
            <a href="../paiements/paiements.html" class="nav-link">
              <i class="fas fa-credit-card"></i> Paiements
            </a>
          </li>
          <li>
            <a href="../ventes/ventes.html" class="nav-link">
              <i class="fas fa-chart-line"></i> Ventes
            </a>
          </li>
          <li>
            <a href="../statistiques/statistiques.html" class="nav-link">
              <i class="fas fa-chart-bar"></i> Statistiques
            </a>
          </li>
          <li>
            <a href="../comptes/comptes.html" class="nav-link">
              <i class="fas fa-user-cog"></i> Comptes
            </a>
          </li>
          <li>
            <a href="../login/login.html" class="nav-link">
              <i class="fas fa-sign-in-alt"></i> Connexion
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <main>
      <h1>Livraisons</h1>
      <p class="subtitle">Enregistrer une nouvelle livraison de récolte</p>

      <!-- *** NE PAS MODIFIER les id ci-dessous – main.js les utilise *** -->
      <form id="form-livraison">
        <select id="f-membre">
          <option value="">-- Choisir un membre --</option>
          <option value="1">Jean Mabiala</option>
          <option value="8">Odette Kimbembe</option>
          <option value="3">Ferdinand Loubota</option>
          <option value="4">Sandra Malonga</option>
          <option value="2">Alphonsine Nkounkou</option>
        </select>

        <select id="f-culture">
          <option value="">-- Choisir une culture --</option>
          <option value="Manioc">Manioc</option>
          <option value="Maïs">Maïs</option>
          <option value="Arachide">Arachide</option>
        </select>

        <input
          type="number"
          id="f-quantite"
          min="1"
          placeholder="Quantité (kg)"
        />

        <button type="submit">Enregistrer</button>
      </form>

      <div
        id="message-erreur-livraison"
        class="message message-erreur"
        hidden
      ></div>
      <div
        id="message-succes-livraison"
        class="message message-succes"
        hidden
      ></div>
      <!-- *** fin de la zone protégée *** -->

      <button id="btn-trier-livraisons" type="button">Trier par date</button>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Membre</th>
              <th>Culture</th>
              <th>Quantité</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="liste-livraisons"></tbody>
        </table>
      </div>
    </main>

    <!-- NE PAS MODIFIER – scripts de connexion au backend -->
    <script src="../functions.js"></script>
    <script src="../main.js"></script>

    <!-- Script sidebar / burger (UI uniquement) -->
    <script>
      const burger = document.getElementById("burger-btn");
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebar-overlay");

      function toggleSidebar() {
        const open = sidebar.classList.toggle("open");
        burger.setAttribute("aria-expanded", open);
        if (overlay) overlay.classList.toggle("visible", open);
      }

      if (burger && sidebar) {
        burger.addEventListener("click", toggleSidebar);
      }
      if (overlay) {
        overlay.addEventListener("click", toggleSidebar);
      }
    </script>
  </body>
</html>

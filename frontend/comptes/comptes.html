<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriCoop Connect — Comptes</title>
  <link rel="stylesheet" href="comptes.css">
</head>
<body>

  <div class="layout">
    <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle-input">

    <aside class="sidebar">
      <div class="sidebar-brand">AgriCoop COMAKI</div>
      <nav class="sidebar-nav">
        <a href="../dashboard/dashboard.html">Dashboard</a>
        <a href="../membres/membres.html">Membres</a>
        <a href="../livraisons/livraisons.html">Livraisons</a>
        <a href="../paiements/paiements.html">Paiements</a>
        <a href="../ventes/ventes.html">Ventes</a>
        <a href="../statistiques/statistiques.html">Statistiques</a>
        <a href="../comptes/comptes.html" class="active">Comptes</a>
      </nav>
    </aside>

    <div class="content-area">
      <header class="topbar">
        <label for="sidebar-toggle" class="sidebar-toggle-label"></label>
        <div>
          <h1>Comptes</h1>
          <p class="sous-titre">Réservé à la Secrétaire — gestion des comptes utilisateurs</p>
        </div>
      </header>

      <main>
        <!-- *** NE PAS MODIFIER l'id ci-dessous *** -->
        <div id="acces-refuse-comptes" hidden></div>

        <!-- *** NE PAS MODIFIER les id ci-dessous – main.js les utilise *** -->
        <form id="form-nouveau-compte">
          <input type="text" id="c-nom-utilisateur" placeholder="Nom d'utilisateur">
          <input type="password" id="c-mot-de-passe" placeholder="Mot de passe temporaire">
          <input type="text" id="c-nom-complet" placeholder="Nom complet">
          <select id="c-role">
            <option value="">-- Choisir un rôle --</option>
            <option value="Président">Président</option>
            <option value="Trésorière">Trésorière</option>
            <option value="Responsable dépôt">Responsable dépôt</option>
            <option value="Membre">Membre</option>
          </select>
          <button type="submit">Créer le compte</button>
        </form>

        <div id="message-erreur-compte" class="message message-erreur" hidden></div>
        <div id="message-succes-compte" class="message message-succes" hidden></div>

        <table>
          <thead>
            <tr>
              <th>Nom d'utilisateur</th>
              <th>Nom complet</th>
              <th>Rôle</th>
            </tr>
          </thead>
          <tbody id="liste-comptes"></tbody>
        </table>
        <!-- *** fin de la zone protégée *** -->
      </main>
    </div>
  </div>

  <!-- NE PAS MODIFIER – scripts de connexion au backend -->
  <script src="../functions.js"></script>
  <script src="../main.js"></script>
</body>
</html>
